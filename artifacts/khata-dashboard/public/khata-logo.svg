<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1c0d06" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="basketBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="trimGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Traditional Circular Border with Beads -->
  <circle cx="250" cy="250" r="215" fill="#24130a" stroke="url(#goldGradient)" stroke-width="6"/>
  <circle cx="250" cy="250" r="202" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.8"/>

  <!-- Decorative Sparkles -->
  <g fill="#fef08a" opacity="0.9">
    <!-- Star 1 -->
    <path d="M 120 120 Q 120 140 100 140 Q 120 140 120 160 Q 120 140 140 140 Q 120 140 120 120 Z"/>
    <!-- Star 2 -->
    <path d="M 380 120 Q 380 140 360 140 Q 380 140 380 160 Q 380 140 400 140 Q 380 140 380 120 Z" transform="scale(0.8) translate(100, 30)"/>
    <!-- Star 3 -->
    <circle cx="150" cy="350" r="4"/>
    <circle cx="360" cy="340" r="5"/>
  </g>

  <!-- Central Kirana Shopping Basket -->
  <!-- Basket Handle -->
  <path d="M 175 190 C 175 110, 325 110, 325 190" fill="none" stroke="url(#goldGradient)" stroke-width="14" stroke-linecap="round" filter="url(#goldGlow)"/>
  <path d="M 175 190 C 175 110, 325 110, 325 190" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Basket Rim -->
  <rect x="110" y="180" width="280" height="26" rx="13" fill="url(#trimGold)" stroke="#78350f" stroke-width="3"/>

  <!-- Basket Body -->
  <path d="M 130 206 L 370 206 L 340 330 C 335 348, 318 360, 300 360 L 200 360 C 182 360, 165 348, 160 330 Z" fill="url(#basketBody)" stroke="#78350f" stroke-width="4"/>

  <!-- Woven Grid Lines on Basket -->
  <!-- Horizontal Weaves -->
  <path d="M 138 245 L 362 245" stroke="#fef08a" stroke-width="3" opacity="0.6"/>
  <path d="M 148 285 L 352 285" stroke="#fef08a" stroke-width="3" opacity="0.6"/>
  <path d="M 160 325 L 340 325" stroke="#fef08a" stroke-width="3" opacity="0.6"/>

  <!-- Diagonal / Vertical Weaves -->
  <path d="M 190 206 L 220 360" stroke="#78350f" stroke-width="4" opacity="0.5"/>
  <path d="M 250 206 L 250 360" stroke="#78350f" stroke-width="4" opacity="0.5"/>
  <path d="M 310 206 L 280 360" stroke="#78350f" stroke-width="4" opacity="0.5"/>

  <path d="M 155 206 L 180 360" stroke="#fef08a" stroke-width="2.5" opacity="0.6"/>
  <path d="M 220 206 L 200 360" stroke="#fef08a" stroke-width="2.5" opacity="0.6"/>
  <path d="M 280 206 L 300 360" stroke="#fef08a" stroke-width="2.5" opacity="0.6"/>
  <path d="M 345 206 L 320 360" stroke="#fef08a" stroke-width="2.5" opacity="0.6"/>

  <!-- Rupees Symbol on Basket Front Badge -->
  <circle cx="250" cy="275" r="32" fill="#24130a" stroke="url(#goldGradient)" stroke-width="3"/>
  <text x="250" y="287" font-family="'Arial', 'Helvetica', sans-serif" font-size="34" font-weight="900" fill="#fef08a" text-anchor="middle">₹</text>

  <!-- Typography: KHATA Banner -->
  <g transform="translate(0, 395)">
    <!-- KHATA Text -->
    <text x="250" y="25" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="44" font-weight="900" letter-spacing="8" fill="url(#trimGold)" text-anchor="middle" filter="url(#goldGlow)">
      KHATA
    </text>
    <text x="250" y="25" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="44" font-weight="900" letter-spacing="8" fill="#ffffff" text-anchor="middle">
      KHATA
    </text>
    <!-- Subtitle -->
    <text x="250" y="48" font-family="'Instrument Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#fde68a" text-anchor="middle" opacity="0.9">
      DIGITAL KHATA FOR KIRANA SHOPS
    </text>
  </g>
</svg>
